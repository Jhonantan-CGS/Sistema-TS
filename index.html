    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1A1C1E; color: #F8F9FA; position: relative; overflow-x: hidden; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        :root {
            --bg-card: rgba(40, 44, 49, 0.7);
            --safety-gold: #FFC107;
            --safety-green: #2ECC71;
            --safety-red: #E74C3C;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            width: 100%;
            padding: 0.85rem;
            border-radius: 0.5rem;
            font-size: 14px;
            transition: all 0.2s ease;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #FFF;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--safety-gold);
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        .input-field::placeholder { color: #94a3b8; font-style: italic; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .textarea-ia { min-height: 80px; resize: none; overflow: hidden; }

        .section-title {
            font-size: 0.95rem;
            color: var(--safety-gold);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.75rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 1px;
        }

        input[type="checkbox"],
        input[type="radio"]:not(.hidden-radio) {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: var(--safety-gold);
            cursor: pointer;
            outline: none;
            box-shadow: none;
            border-radius: 4px;
        }

        .hidden-radio { display: none !important; }

        .btn-ia {
            background: linear-gradient(90deg, #8B5CF6 0%, #3B82F6 100%);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .signature-canvas {
            border: 2px solid var(--safety-gold);
            border-radius: 0.5rem;
            background: #fff;
            touch-action: none;
            width: 100%;
            height: 200px;
        }

        #pdfTemplate {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 210mm;
            background: #ffffff !important;
            color: #000000 !important;
            padding: 10mm;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 10.5px;
            line-height: 1.3;
        }

        .pdf-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .pdf-header-texts h1 {
            font-size: 18px;
            margin: 0;
            font-weight: bold;
            color: #000 !important;
        }

        .pdf-header-texts h2 {
            font-size: 12px;
            margin: 3px 0 0 0;
            color: #000 !important;
        }

        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }

        .pdf-table th,
        .pdf-table td {
            border: 1px solid #000;
            padding: 5px;
            text-align: left;
            vertical-align: top;
            color: #000 !important;
        }

        .pdf-table th {
            background-color: #e5e7eb;
            font-weight: bold;
        }

        .pdf-signatures-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            page-break-inside: avoid;
        }

        .pdf-sign-box {
            width: 160px;
            text-align: center;
            margin-bottom: 10px;
            color: #000 !important;
        }

        .pdf-sign-img {
            height: 45px;
            object-fit: contain;
            margin-bottom: 5px;
            border-bottom: 1px solid #000;
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        .check-table td { text-align: center; }
        .check-table td:first-child { text-align: left; }
    </style>
</head>
<body class="pb-10">

    <div class="fixed inset-0 pointer-events-none z-[-1] flex items-center justify-center opacity-[0.04]">
        <svg width="80vw" height="80vw" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 L95 25 L95 75 L50 95 L5 75 L5 25 Z" stroke="#FFFFFF" stroke-width="2" fill="none"/>
            <path d="M55 35 C 40 35, 30 40, 30 50 C 30 60, 70 55, 70 65 C 70 75, 45 75, 45 75" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
        </svg>
    </div>

    <header class="bg-[#1A1C1E]/95 backdrop-blur-md border-b border-white/10 p-3 shadow-lg sticky top-0 z-40">
        <div class="container mx-auto max-w-4xl flex justify-between items-center px-2">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 drop-shadow-[0_0_8px_rgba(255,193,7,0.6)]">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 20 L50 5 L90 20 L90 50 C90 75 50 95 50 95 C50 95 10 75 10 50 Z" fill="#1A1C1E" stroke="#FFC107" stroke-width="5"/>
                        <path d="M30 50 L45 65 L70 35" fill="none" stroke="#2ECC71" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-[1.1rem] sm:text-xl font-montserrat tracking-widest text-white">CYSY <span class="text-[#FFC107]">FERTILIZANTES</span></h1>
                    <p class="text-[8px] sm:text-[9px] text-[#2ECC71] uppercase tracking-[0.2em] font-bold">SEGURANÇA 4.0 - PTA NR-35 | V 1.5</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-3 sm:px-4 mt-6 max-w-4xl space-y-6 relative z-10">
        <form id="ptaForm">

            <section class="glass-card p-4 sm:p-6 rounded-2xl mb-6">
                <h3 class="section-title font-montserrat"><i data-lucide="clock-4"></i> 1. Identificação</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider">Data/Hora Emissão <span class="text-[#FFC107]">*</span></label>
                        <div class="flex gap-2">
                            <input type="date" id="f_emissao_data" required class="input-field">
                            <input type="time" id="f_emissao_hora" required class="input-field">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider">Data/Hora Término <span class="text-[#FFC107]">*</span></label>
                        <div class="flex gap-2">
                            <input type="date" id="f_termino_data" required class="input-field">
                            <input type="time" id="f_termino_hora" required class="input-field">
                        </div>
                    </div>
                    <div class="space-y-1 sm:col-span-2">
                        <label class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider block mb-2">Mão de Obra <span class="text-[#FFC107]">*</span></label>
                        <div class="flex flex-wrap gap-5">
                            <label class="flex items-center gap-2 cursor-pointer text-sm hover:text-white"><input type="radio" name="f_mao_obra" value="Interna" required> Interna</label>
                            <label class="flex items-center gap-2 cursor-pointer text-sm hover:text-white"><input type="radio" name="f_mao_obra" value="Externa"> Externa</label>
                            <label class="flex items-center gap-2 cursor-pointer text-sm hover:text-white"><input type="radio" name="f_mao_obra" value="Interna e Externa"> Interna e Externa</label>
                        </div>
                    </div>
                </div>
            </section>

            <section class="glass-card p-4 sm:p-6 rounded-2xl mb-6">
                <div class="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center mb-5 border-b border-white/10 pb-3 gap-3">
                    <h3 class="text-[0.95rem] font-bold text-[#FFC107] font-montserrat uppercase flex items-center gap-2"><i data-lucide="users"></i> 2. Profissionais Autorizados</h3>
                    <button type="button" onclick="adicionarTrabalhador()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-2 px-3 rounded-lg text-xs flex items-center gap-2 w-full sm:w-auto justify-center transition">
                        <i data-lucide="user-plus" size="14"></i> + Adicionar Trabalhador
                    </button>
                </div>
                <div id="containerTrabalhadores" class="space-y-5"></div>
            </section>

            <section class="glass-card p-4 sm:p-6 rounded-2xl mb-6">
                <h3 class="section-title font-montserrat"><i data-lucide="crosshair"></i> 3. Local e Tarefa</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider">Local Específico <span class="text-[#FFC107]">*</span></label>
                        <input type="text" id="f_ativ_local" required class="input-field" placeholder="Onde ocorrerá a tarefa?">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider">Altura Aproximada (Metros) <span class="text-[#FFC107]">*</span></label>
                        <input type="number" id="f_ativ_altura" required class="input-field" placeholder="Ex: 5">
                    </div>
                    <div class="sm:col-span-2 space-y-1">
                        <label class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider">Descrição Detalhada <span class="text-[#FFC107]">*</span></label>
                        <textarea id="f_ativ_desc" required rows="2" class="input-field" placeholder="O que será feito..."></textarea>
                    </div>
                </div>
            </section>

            <section class="glass-card p-4 sm:p-6 rounded-2xl mb-6">
                <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                    <h3 class="text-[0.95rem] font-bold text-[#FFC107] font-montserrat uppercase flex items-center gap-2"><i data-lucide="cloud-lightning"></i> 4. Clima</h3>
                    <button type="button" onclick="fetchWeatherAPI()" id="btnClima" class="bg-blue-600/40 hover:bg-blue-600/60 border border-blue-500/50 text-white font-bold py-1.5 px-3 rounded-lg text-xs flex items-center gap-2 transition">
                        <i data-lucide="satellite" size="14"></i> Radar GPS
                    </button>
                </div>
                <div class="flex flex-col sm:grid sm:grid-cols-2 gap-3 mb-4" id="chk_clima">
                    <label class="flex items-center gap-3 text-sm hover:text-white transition p-2 bg-black/20 rounded-lg"><input type="checkbox" value="Céu Limpo/Sol"> Céu Limpo/Sol</label>
                    <label class="flex items-center gap-3 text-sm hover:text-white transition p-2 bg-black/20 rounded-lg"><input type="checkbox" value="Nublado"> Nublado</label>
                    <label class="flex items-center gap-3 text-sm hover:text-white transition p-2 bg-black/20 rounded-lg"><input type="checkbox" value="Chuva Leve/Garoa"> Chuva Leve</label>
                    <label class="flex items-center gap-3 text-sm text-[#E74C3C] font-bold hover:text-red-400 transition p-2 bg-black/20 rounded-lg border border-red-500/20"><input type="checkbox" value="Chuva Forte"> Chuva Forte</label>
                    <label class="flex items-center gap-3 text-sm text-[#FFC107] font-bold hover:text-yellow-400 transition p-2 bg-black/20 rounded-lg border border-yellow-500/20"><input type="checkbox" value="Vento Forte"> Vento Forte</label>
                    <label class="flex items-center gap-3 text-sm hover:text-white transition p-2 bg-black/20 rounded-lg"><input type="checkbox" value="Vento Leve"> Vento Leve</label>
                </div>
                <input type="text" id="f_clima_outro" class="input-field text-center font-bold text-white/80" placeholder="Aguardando Radar GPS ou preencha..." readonly>
            </section>

            <section class="glass-card p-4 sm:p-6 rounded-2xl mb-6">
                <h3 class="section-title font-montserrat"><i data-lucide="shield-check"></i> 5. Proteção (EPI/EPC)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="bg-black/20 p-4 rounded-lg border border-white/5">
                        <label class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider block mb-3 border-b border-white/10 pb-2">EPIs Verificados <span class="text-[#FFC107]">*</span></label>
                        <div class="space-y-3" id="chk_epis">
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Cinto Paraquedista"> Cinto Paraquedista</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Talabarte Duplo"> Talabarte Duplo</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Trava Quedas"> Trava Quedas</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Capacete Jugular"> Capacete Jugular</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Luvas de Segurança"> Luvas de Segurança</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Óculos de Segurança"> Óculos</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Botina de Segurança"> Botina de Segurança</label>
                        </div>
                        <input type="text" id="f_epi_outro" class="input-field mt-3 py-1.5" placeholder="+ Adicionar EPI">
                    </div>
                    <div class="bg-black/20 p-4 rounded-lg border border-white/5">
                        <label class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider block mb-3 border-b border-white/10 pb-2">EPCs Instalados <span class="text-[#FFC107]">*</span></label>
                        <div class="space-y-3" id="chk_epcs">
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Linha de Vida Fixa"> Linha Vida Fixa</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Linha Prov."> Linha Provisória</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Corda 12mm"> Corda 12mm</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Cinta de Ancoragem"> Cinta de Ancoragem</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Cones e Fitas"> Isolamento (Cones/Fitas)</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Escada Certificada"> Escada Certificada</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Guarda Corpo"> Guarda Corpo</label>
                            <label class="flex items-center gap-3 text-sm hover:text-[#FFC107]"><input type="checkbox" value="Andaime / Plataforma"> Andaime / Plataforma</label>
                        </div>
                        <input type="text" id="f_epc_outro" class="input-field mt-3 py-1.5" placeholder="+ Adicionar EPC">
                    </div>
                </div>
            </section>

            <section class="glass-card p-4 sm:p-6 rounded-2xl mb-6">
                <h3 class="section-title font-montserrat"><i data-lucide="list-checks"></i> 6. Auditoria NR-35</h3>
                <div class="space-y-2 mb-6" id="div
